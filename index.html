<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Happy Birthday Mr. Koos!</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --cream: #fffaf0;
      --blue: #ccecff;
      --blue-dark: #8fd1f7;
      --red: #e64639;
      --yellow: #ffdb63;
      --pink: #ffd6df;
      --green: #c8f5c9;
      --ink: #222;
      --white: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Fredoka", sans-serif;
      background: var(--cream);
      color: var(--ink);
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    /* =============================
       ENTRY SCREEN
    ============================== */

    #entryScreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,.9), transparent 22%),
        radial-gradient(circle at 85% 20%, rgba(255,255,255,.55), transparent 20%),
        linear-gradient(180deg, var(--blue), #eefaff 75%, var(--cream));

      padding: 30px 20px;

      transition:
        opacity .8s ease,
        transform .8s ease;
    }

    #entryScreen.unlocked {
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
    }

    .entry-card {
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    .birthday-tag {
      display: inline-block;

      background: var(--yellow);
      border: 3px solid var(--ink);
      border-radius: 100px;

      padding: 8px 18px;

      font-family: "Patrick Hand", cursive;
      font-size: 22px;

      box-shadow: 4px 4px 0 var(--ink);

      transform: rotate(-2deg);

      margin-bottom: 22px;
    }

    .entry-snoopy {
      width: min(330px, 80vw);
      margin: auto;

      filter: drop-shadow(9px 12px 0 rgba(0,0,0,.08));

      animation: snoopyFloat 3s ease-in-out infinite;
    }

    @keyframes snoopyFloat {
      50% {
        transform: translateY(-10px) rotate(2deg);
      }
    }

    .entry-title {
      margin: 20px 0 6px;

      font-family: "Patrick Hand", cursive;
      font-size: clamp(32px, 6vw, 53px);
    }

    .entry-subtitle {
      font-family: "Patrick Hand", cursive;
      font-size: 22px;
      opacity: .8;
      margin-bottom: 24px;
    }

    .age-box {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #ageInput {
      width: 180px;

      border: 3px solid var(--ink);
      border-radius: 14px;

      background: white;

      padding: 14px 16px;

      text-align: center;

      font-size: 26px;
      font-weight: 600;

      outline: none;

      box-shadow: 5px 5px 0 rgba(0,0,0,.12);
    }

    #ageInput:focus {
      box-shadow: 7px 7px 0 var(--yellow);
    }

    #enterButton {
      border: 3px solid var(--ink);
      border-radius: 14px;

      background: var(--red);
      color: white;

      padding: 14px 22px;

      font-weight: 700;
      font-size: 18px;

      cursor: pointer;

      box-shadow: 5px 5px 0 var(--ink);

      transition: .15s;
    }

    #enterButton:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0 var(--ink);
    }

    #ageMessage {
      min-height: 32px;

      margin-top: 18px;

      font-family: "Patrick Hand", cursive;
      font-size: 22px;
    }

    .tiny-hint {
      margin-top: 20px;
      opacity: .5;

      font-family: "Patrick Hand", cursive;
      font-size: 17px;
    }

    /* =============================
       MAIN BIRTHDAY PAGE
    ============================== */

    #mainPage {
      display: none;
      min-height: 100vh;
    }

    .birthday-hero {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 60px 20px;

      background:
        radial-gradient(circle at 15% 15%, #fff 0 5%, transparent 5.5%),
        radial-gradient(circle at 84% 22%, #fff 0 4%, transparent 4.5%),
        linear-gradient(180deg, var(--blue), #edfaff 70%, var(--cream));

      position: relative;
      overflow: hidden;
    }

    .hero-content {
      width: min(900px, 100%);
      position: relative;
      z-index: 2;
    }

    .hero-small {
      font-family: "Patrick Hand", cursive;
      font-size: 26px;
      margin-bottom: 10px;
    }

    .birthday-hero h1 {
      font-size: clamp(65px, 11vw, 130px);
      line-height: .85;
      letter-spacing: -5px;
      margin: 15px 0;
    }

    .birthday-hero h1 span {
      color: var(--red);
      display: block;
    }

    .hero-text {
      font-family: "Patrick Hand", cursive;
      font-size: clamp(25px, 4vw, 38px);
      margin-bottom: 35px;
    }

    .scroll-button {
      display: inline-block;

      background: var(--yellow);

      border: 3px solid var(--ink);
      border-radius: 16px;

      box-shadow: 6px 6px 0 var(--ink);

      padding: 15px 22px;

      font-weight: 700;
      cursor: pointer;

      text-decoration: none;
      color: var(--ink);

      transition: .15s;
    }

    .scroll-button:hover {
      transform: translate(-3px, -3px);
      box-shadow: 9px 9px 0 var(--ink);
    }

    /* =============================
       QUIZ
    ============================== */

    .game-section {
      min-height: 100vh;

      display: flex;
      align-items: center;

      padding: 90px 20px;

      background: var(--cream);
    }

    .game-container {
      width: min(850px, 100%);
      margin: auto;
    }

    .game-heading {
      text-align: center;
      margin-bottom: 40px;
    }

    .game-heading h2 {
      margin: 0;

      font-size: clamp(46px, 7vw, 72px);
      letter-spacing: -2px;
    }

    .game-card {
      border: 4px solid var(--ink);
      border-radius: 22px;

      background: white;

      overflow: hidden;

      box-shadow: 12px 12px 0 var(--yellow);
    }

    .game-topbar {
      background: var(--blue);

      border-bottom: 3px solid var(--ink);

      padding: 18px 22px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-weight: 600;
    }

    .question-box {
      padding: 38px 30px 18px;
      text-align: center;
    }

    #questionText {
      margin: 0;
      font-family: "Patrick Hand", cursive;
      font-size: clamp(30px, 5vw, 43px);
      line-height: 1.2;
    }

    .answers {
      padding: 20px 25px 25px;

      display: grid;
      gap: 13px;
    }

    .answer-button {
      width: 100%;

      text-align: left;

      border: 3px solid var(--ink);
      border-radius: 13px;

      background: var(--cream);

      padding: 16px 18px;

      cursor: pointer;

      font-size: 17px;

      transition: .15s;
    }

    .answer-button:hover {
      background: var(--yellow);
      transform: translateX(4px);
    }

    #gameFeedback {
      min-height: 55px;

      text-align: center;

      padding: 0 20px 25px;

      font-family: "Patrick Hand", cursive;
      font-size: 25px;
    }

    #nextButton {
      display: none;

      margin: 0 auto 30px;

      border: 3px solid var(--ink);
      border-radius: 13px;

      background: var(--red);
      color: white;

      box-shadow: 5px 5px 0 var(--ink);

      padding: 13px 22px;

      font-weight: 700;

      cursor: pointer;
    }

    /* =============================
       FINAL RESULT
    ============================== */

    #resultScreen {
      display: none;

      text-align: center;

      padding: 45px 25px;
    }

    #resultScreen h3 {
      font-size: 47px;
      margin-bottom: 10px;
    }

    #resultScreen p {
      font-family: "Patrick Hand", cursive;
      font-size: 28px;
      line-height: 1.4;
    }

    .result-snoopy {
      width: 200px;
      margin: 20px auto;
    }

    /* =============================
       CONFETTI
    ============================== */

    .confetti {
      position: fixed;

      top: -20px;

      width: 10px;
      height: 15px;

      z-index: 9999;

      pointer-events: none;

      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      to {
        transform:
          translateY(110vh)
          rotate(900deg);
      }
    }

    /* floating birthday shapes */

    .shape {
      position: absolute;

      font-size: 35px;

      animation: shapeFloat 5s ease-in-out infinite;

      opacity: .6;
    }

    .s1 {
      left: 8%;
      top: 14%;
    }

    .s2 {
      right: 9%;
      top: 20%;
      animation-delay: .8s;
    }

    .s3 {
      left: 12%;
      bottom: 16%;
      animation-delay: 1.5s;
    }

    .s4 {
      right: 12%;
      bottom: 15%;
      animation-delay: 2.2s;
    }

    @keyframes shapeFloat {
      50% {
        transform:
          translateY(-16px)
          rotate(10deg);
      }
    }

    @media (max-width: 600px) {

      .age-box {
        flex-direction: column;
        align-items: center;
      }

      #ageInput,
      #enterButton {
        width: min(300px, 90%);
      }

      .birthday-hero h1 {
        letter-spacing: -2px;
      }

      .game-topbar {
        font-size: 14px;
      }

      .question-box {
        padding: 30px 20px 10px;
      }
    }
  </style>
</head>

<body>

  <!-- ===========================
       ENTRY / AGE SCREEN
  ============================ -->

  <div id="entryScreen">

    <div class="entry-card">

      <div class="birthday-tag">
        🎂 TOP SECRET BIRTHDAY ACCESS
      </div>

      <img
        class="entry-snoopy"
        src="https://i.pinimg.com/564x/4b/0c/c5/4b0cc5ece35c9fac317860b0b4609ed1.jpg"
        alt="Birthday Snoopy"
      >

      <div class="entry-title">
        Enter Koos's birthday age
      </div>

      <div class="entry-subtitle">
        Authentication required.
      </div>

      <div class="age-box">

        <input
          id="ageInput"
          type="number"
          placeholder="?"
          min="1"
          autocomplete="off"
        >

        <button id="enterButton">
          ENTER →
        </button>

      </div>

      <div id="ageMessage"></div>

      <div class="tiny-hint">
        hint: hopefully Mr. Koos knows this one
      </div>

    </div>

  </div>


  <!-- ===========================
       MAIN PAGE
  ============================ -->

  <main id="mainPage">

    <section class="birthday-hero">

      <div class="shape s1">🎈</div>
      <div class="shape s2">⭐</div>
      <div class="shape s3">🎂</div>
      <div class="shape s4">🎉</div>

      <div class="hero-content">

        <div class="hero-small">
          System.out.println(
        </div>

        <h1>
          HAPPY BIRTHDAY
          <span>MR. KOOS!</span>
        </h1>

        <div class="hero-small">
          );
        </div>

        <a
          class="scroll-button"
          href="#game"
        >
          TAKE THE KOOS QUIZ ↓
        </a>

      </div>

    </section>


    <!-- ===========================
         QUIZ
    ============================ -->

    <section
      class="game-section"
      id="game"
    >

      <div class="game-container">

        <div class="game-heading">

          <h2>
            The Koos Quiz
          </h2>

        </div>

        <div class="game-card">

          <div id="activeGame">

            <div class="game-topbar">

              <span id="questionNumber">
                Question 1 of 3
              </span>

              <span>
                Score:
                <strong id="score">0</strong>
                / 3
              </span>

            </div>

            <div class="question-box">
              <h3 id="questionText"></h3>
            </div>

            <div
              class="answers"
              id="answers"
            ></div>

            <div id="gameFeedback"></div>

            <button id="nextButton">
              NEXT QUESTION →
            </button>

          </div>


          <div id="resultScreen">

            <img
              class="result-snoopy"
              src="https://static.vecteezy.com/system/resources/thumbnails/070/968/671/small_2x/snoopy-serving-cake-free-vector.jpg"
              alt="Birthday Snoopy"
            >

            <h3 id="resultTitle">
              3 / 3!
            </h3>

            <p id="resultText"></p>

          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- ===========================
       AUDIO
  ============================ -->

  <audio
    id="birthdayMusic"
    loop
  >
    <source
      src="https://www.soundjay.com/human/sounds/happy-birthday-song-01.mp3"
      type="audio/mpeg"
    >
  </audio>


  <script>

    /* ======================================
       AGE UNLOCK
    ====================================== */

    const CORRECT_AGE = 31;

    const entryScreen =
      document.getElementById("entryScreen");

    const mainPage =
      document.getElementById("mainPage");

    const ageInput =
      document.getElementById("ageInput");

    const ageMessage =
      document.getElementById("ageMessage");

    const enterButton =
      document.getElementById("enterButton");

    const birthdayMusic =
      document.getElementById("birthdayMusic");


    function checkAge() {

      const enteredAge =
        Number(ageInput.value);


      if (enteredAge === CORRECT_AGE) {

        ageMessage.innerHTML =
          "✓ Identity confirmed. Compiling birthday...";

        ageMessage.style.color =
          "#268d3d";


        birthdayMusic.volume = 0.35;

        birthdayMusic
          .play()
          .catch(() => {
            console.log(
              "Audio autoplay was blocked."
            );
          });


        createConfetti(220);


        setTimeout(() => {

          mainPage.style.display =
            "block";

          entryScreen.classList.add(
            "unlocked"
          );

        }, 900);


        setTimeout(() => {

          entryScreen.style.display =
            "none";

        }, 1700);

      }

      else if (!ageInput.value) {

        ageMessage.innerHTML =
          "You have to enter something 😭";

        ageMessage.style.color =
          "#e64639";

      }

      else {

        ageMessage.innerHTML =
          "❌ Compilation error: incorrect age.";

        ageMessage.style.color =
          "#e64639";

        ageInput.animate(
          [
            { transform: "translateX(0)" },
            { transform: "translateX(-8px)" },
            { transform: "translateX(8px)" },
            { transform: "translateX(-8px)" },
            { transform: "translateX(0)" }
          ],
          {
            duration: 350
          }
        );

      }

    }


    enterButton.addEventListener(
      "click",
      checkAge
    );


    ageInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          checkAge();
        }

      }
    );


    /* ======================================
       KOOS QUIZ
    ====================================== */

    const questions = [

      {
        question:
          "1) What does a constructor do?",

        answers: [
          "Initializes the fields of an object.",
          "Returns a value from every method.",
          "Deletes an object when the program finishes.",
          "Builds a tiny house where Java objects live."
        ],

        correct: 0,

        success:
          "Correct! Constructor successfully constructed. ☕",

        fail:
          "Not quite. The constructor initializes the object's fields."
      },


      {
        question:
          "2) What does Mr. Koos want his students to do?",

        answers: [
          "Do well on the AP test.",
          "Participate in senior pranks.",
          "Buy him a flamethrower.",
          "Replace every Chromebook with a gaming PC."
        ],

        correct: 1,

        success:
          "Correct. They are his favorite.",

        fail:
          "Incorrect. Clearly the answer is senior pranks."
      },


      {
        question:
          "3) Which kitchen appliance does Mr. Koos refuse to use?",

        answers: [
          "Microwaves.",
          "Easy-Bake Ovens.",
          "Toasters.",
          "Any appliance that doesn't run Java."
        ],

        correct: 0,

        success:
          "Excellent.",

        fail:
          "Wrong. Mr. Koos remains firmly anti-microwave."
      }

    ];


    let currentQuestion = 0;
    let gameScore = 0;
    let answered = false;


    const questionText =
      document.getElementById("questionText");

    const answersContainer =
      document.getElementById("answers");

    const questionNumber =
      document.getElementById("questionNumber");

    const scoreDisplay =
      document.getElementById("score");

    const feedback =
      document.getElementById("gameFeedback");

    const nextButton =
      document.getElementById("nextButton");

    const activeGame =
      document.getElementById("activeGame");

    const resultScreen =
      document.getElementById("resultScreen");

    const resultTitle =
      document.getElementById("resultTitle");

    const resultText =
      document.getElementById("resultText");


    function loadQuestion() {

      answered = false;

      const question =
        questions[currentQuestion];


      questionNumber.innerText =
        `Question ${currentQuestion + 1} of ${questions.length}`;


      questionText.innerText =
        question.question;


      answersContainer.innerHTML =
        "";


      feedback.innerHTML =
        "";


      nextButton.style.display =
        "none";


      question.answers.forEach(
        (answer, index) => {

          const button =
            document.createElement("button");

          button.className =
            "answer-button";

          button.innerText =
            answer;

          button.addEventListener(
            "click",
            function() {

              answerQuestion(
                index,
                button
              );

            }
          );

          answersContainer.appendChild(
            button
          );

        }
      );

    }


    function answerQuestion(
      selected,
      selectedButton
    ) {

      if (answered) {
        return;
      }

      answered = true;


      const question =
        questions[currentQuestion];


      const buttons =
        document.querySelectorAll(
          ".answer-button"
        );


      if (
        selected === question.correct
      ) {

        gameScore++;

        scoreDisplay.innerText =
          gameScore;

        selectedButton.style.background =
          "#c8f5c9";

        feedback.innerHTML =
          "✓ " + question.success;

        feedback.style.color =
          "#268d3d";

      }

      else {

        selectedButton.style.background =
          "#ffd1d1";

        buttons[
          question.correct
        ].style.background =
          "#c8f5c9";

        feedback.innerHTML =
          "✗ " + question.fail;

        feedback.style.color =
          "#d63e34";

      }


      buttons.forEach(button => {

        button.style.pointerEvents =
          "none";

      });


      nextButton.style.display =
        "block";

    }


    nextButton.addEventListener(
      "click",
      function() {

        currentQuestion++;


        if (
          currentQuestion <
          questions.length
        ) {

          loadQuestion();

        }

        else {

          finishGame();

        }

      }
    );


    function finishGame() {

      activeGame.style.display =
        "none";

      resultScreen.style.display =
        "block";


      resultTitle.innerText =
        `${gameScore} / ${questions.length}`;


      if (gameScore === 3) {

        resultText.innerHTML =
          `
          Perfect score. 🎉
          <br><br>
          Happy Birthday, Mr. Koos!!
          `;

        createConfetti(180);

      }

      else if (gameScore === 2) {

        resultText.innerHTML =
          `
          Pretty solid.
          <br><br>
          Happy Birthday, Mr. Koos! 🎂
          `;

      }

      else {

        resultText.innerHTML =
          `
          Hmm...
          <br><br>
          We may need to reconsider tomorrow's CSA lesson.
          <br><br>
          Happy Birthday anyway, Mr. Koos. 🎂
          `;

      }

    }


    loadQuestion();


    /* ======================================
       CONFETTI
    ====================================== */

    function createConfetti(amount) {

      const colors = [
        "#e64639",
        "#ffdb63",
        "#80cff8",
        "#ffd6df",
        "#222222",
        "#ffffff"
      ];


      for (
        let i = 0;
        i < amount;
        i++
      ) {

        const piece =
          document.createElement("div");


        piece.classList.add(
          "confetti"
        );


        piece.style.left =
          Math.random() * 100 + "vw";


        piece.style.background =
          colors[
            Math.floor(
              Math.random() *
              colors.length
            )
          ];


        piece.style.animationDuration =
          (
            2.2 +
            Math.random() * 3
          ) + "s";


        piece.style.animationDelay =
          (
            Math.random() *
            0.8
          ) + "s";


        piece.style.width =
          (
            7 +
            Math.random() * 10
          ) + "px";


        piece.style.height =
          (
            8 +
            Math.random() * 13
          ) + "px";


        document.body.appendChild(
          piece
        );


        setTimeout(
          () => piece.remove(),
          6500
        );

      }

    }

  </script>

</body>
</html>
